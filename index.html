<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabella esercizi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1c3f66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabella Esercizi">
<style>
  /* transizione fluida tra le pagine (View Transitions API): dove il browser
     non la supporta ancora, queste righe vengono semplicemente ignorate e la
     navigazione resta quella "a scatto" di sempre, nessun problema */
  @view-transition{ navigation: auto; }
  ::view-transition-old(root){ animation: none; }
  ::view-transition-new(root){ animation: viewGrow .22s ease-out both; }
  @keyframes viewGrow{ from{ transform:scale(.94); } to{ transform:scale(1); } }
  /* tornando indietro (rilevato in testa alla pagina via Navigation API),
     l'animazione si inverte: rimpicciolimento invece di ingrandimento */
  html.navBack::view-transition-new(root){ animation: viewShrink .22s ease-out both; }
  @keyframes viewShrink{ from{ transform:scale(1.06); } to{ transform:scale(1); } }

  :root{
    --ink:#1c2b2a; --sub:#5b6b69; --line:#dfe3e1; --bg:#faf3ea;
    --card:#fffdf9; --accent:#1c3f66; --accent-light:#e4ebf2; --accent2:#e8720f;
    /* colore fisso del brand, uguale in chiaro e scuro: non deve seguire --accent
       (che in scuro diventa un azzurro più chiaro) sulle card della dashboard */
    --brand-navy:#1c3f66; --brand-navy-light:#e4ebf2;
    --shadow-1: 0 1px 2px rgba(30,40,35,.05), 0 6px 14px rgba(30,40,35,.07);
    --shadow-1-hover: 0 3px 6px rgba(30,40,35,.07), 0 12px 22px rgba(30,40,35,.11);
    --shadow-primary: 0 2px 4px rgba(10,25,45,.10), 0 12px 26px rgba(10,25,45,.22), inset 0 1px 0 rgba(255,255,255,.10);
    --shadow-primary-hover: 0 4px 8px rgba(10,25,45,.14), 0 18px 34px rgba(10,25,45,.28), inset 0 1px 0 rgba(255,255,255,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f5; --sub:#8fa0b3; --line:#28384a; --bg:#0e1620;
      --card:#16212e; --accent:#4a80c4; --accent-light:#1c2d40; --accent2:#f2913a;
      --shadow-1: 0 1px 2px rgba(0,0,0,.2), 0 6px 16px rgba(0,0,0,.28);
      --shadow-1-hover: 0 3px 6px rgba(0,0,0,.24), 0 14px 26px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1f5; --sub:#8fa0b3; --line:#28384a; --bg:#0e1620;
    --card:#16212e; --accent:#4a80c4; --accent-light:#1c2d40; --accent2:#f2913a;
    --shadow-1: 0 1px 2px rgba(0,0,0,.2), 0 6px 16px rgba(0,0,0,.28);
    --shadow-1-hover: 0 3px 6px rgba(0,0,0,.24), 0 14px 26px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 20px 60px; transition:background-color .2s ease, color .2s ease;
  }
  .settingsBtn{
    position:fixed; top:16px; right:16px; width:38px; height:38px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    z-index:10; transition:border-color .15s ease;
  }
  .settingsBtn:hover{border-color:var(--accent);}
  .settingsBtn svg{width:19px; height:19px;}

  /* ---- intestazione: logo piccolo + separatore verticale + saluto ---- */
  .headerRow{
    display:flex; align-items:center; gap:16px; width:100%; max-width:640px; margin-bottom:30px;
  }
  .headerLogo{
    width:60px; height:60px; flex:none; display:block; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.14), inset 0 0 0 1px rgba(0,0,0,.04);
    padding:3px;
  }
  .headerDivider{width:1px; align-self:stretch; background:var(--line); flex:none;}
  .headerBrand{font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--accent2); margin:0 0 4px;}
  .headerGreeting h1{font-size:24px; font-weight:400; font-style:italic; margin:0 0 3px; letter-spacing:-.01em;}
  .headerGreeting p{font-size:12.5px; color:var(--sub); margin:0;}

  /* ---- griglia azioni: card principale verticale a sinistra, due orizzontali impilate a destra ---- */
  .actionGrid{
    width:100%; max-width:640px; display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:stretch;
  }
  .stackedCards{display:flex; flex-direction:column; gap:14px;}

  .primaryCard{
    position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between;
    color:#fff; border-radius:18px; padding:20px 18px; text-decoration:none;
    min-height:224px; box-shadow:var(--shadow-primary);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .primaryCard::before{
    /* la foto, isolata su un suo livello: così si può ingrandire leggermente
       al passaggio del mouse senza spostare anche testo e icona */
    content:''; position:absolute; inset:0; z-index:0;
    background:url('primary-card-bg.jpg') center/cover;
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .primaryCard::after{
    /* overlay blu navy semi-trasparente sopra la foto, non un blend-mode legato al tema:
       così la foto resta ben visibile e chiara anche in tema chiaro, invece di scurirsi */
    content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(165deg, rgba(28,63,102,.58), rgba(28,63,102,.76));
  }
  .primaryCard:hover{transform:translateY(-3px); box-shadow:var(--shadow-primary-hover);}
  .primaryCard:hover::before{transform:scale(1.06);}
  .primaryCard:active{transform:scale(.98);}
  .primaryCard .primaryIcon, .primaryCard .primaryTextBlock{position:relative; z-index:2;}
  .primaryCard .primaryIcon{
    width:48px; height:48px; border-radius:13px; background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .primaryCard .primaryIcon svg{width:24px; height:24px; stroke:#fff;}
  .primaryCard .eyebrow{font-size:13px; font-weight:400; opacity:.8; margin-bottom:1px;}
  .primaryCard .cardTitle{font-size:19px; font-weight:700;}

  .secondaryTile{
    position:relative; flex:1; display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
    text-decoration:none; color:var(--ink); box-shadow:var(--shadow-1);
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .secondaryTile:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow-1-hover);}
  .secondaryTile .tileIcon{
    width:38px; height:38px; border-radius:11px; background:var(--brand-navy-light); color:var(--brand-navy);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .secondaryTile .tileIcon svg{width:19px; height:19px;}
  .secondaryTile .tileText{min-width:0;}
  .secondaryTile .eyebrow{font-size:11px; font-weight:400; color:var(--sub); margin-bottom:1px;}
  .secondaryTile .cardTitle{font-size:14.5px; font-weight:700;}
  .secondaryTile.soon{opacity:.55; cursor:default; pointer-events:none; box-shadow:none;}
  .secondaryTile.soon .tileIcon{background:var(--line); color:var(--sub);}

  /* la foto (sotto, desaturata per spegnere i toni caldi marrone/dorato) e l'overlay blu
     navy (sopra, alla stessa opacità della card "Crea Scheda", non filtrato quindi resta
     blu navy pieno) sono due livelli separati: il filtro va solo sulla foto, non sul navy */
  .secondaryTile.libraryTile{
    position:relative; overflow:hidden;
    background:var(--card); border-color:transparent; color:#fff;
  }
  .secondaryTile.libraryTile::before{
    content:''; position:absolute; inset:0; z-index:0;
    background:url('libreria-card-bg.png') center/cover;
    filter:saturate(35%);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .secondaryTile.libraryTile::after{
    content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(160deg, rgba(28,63,102,.58), rgba(28,63,102,.76));
  }
  .secondaryTile.libraryTile:hover{border-color:rgba(255,255,255,.4);}
  .secondaryTile.libraryTile:hover::before{transform:scale(1.06);}
  .secondaryTile.libraryTile:active{transform:scale(.98);}
  .secondaryTile.libraryTile .tileIcon{background:rgba(255,255,255,.18); color:#fff;}
  .secondaryTile.libraryTile .eyebrow{color:rgba(255,255,255,.8);}
  .secondaryTile.libraryTile .tileIcon, .secondaryTile.libraryTile .tileText{position:relative; z-index:2;}

  /* stessa struttura della tessera "Libreria": foto propria (desaturata per
     spegnere i toni caldi) sotto l'overlay blu navy pieno */
  .secondaryTile.calendarTile{
    position:relative; overflow:hidden;
    background:var(--card); border-color:transparent; color:#fff;
  }
  .secondaryTile.calendarTile::before{
    content:''; position:absolute; inset:0; z-index:0;
    background:url('calendario-card-bg.jpg') center/cover;
    filter:saturate(35%);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .secondaryTile.calendarTile::after{
    content:''; position:absolute; inset:0; z-index:1;
    background:linear-gradient(160deg, rgba(28,63,102,.58), rgba(28,63,102,.76));
  }
  .secondaryTile.calendarTile:hover{border-color:rgba(255,255,255,.4);}
  .secondaryTile.calendarTile:hover::before{transform:scale(1.06);}
  .secondaryTile.calendarTile:active{transform:scale(.98);}
  .secondaryTile.calendarTile .tileIcon{background:rgba(255,255,255,.18); color:#fff;}
  .secondaryTile.calendarTile .eyebrow{color:rgba(255,255,255,.8);}
  .secondaryTile.calendarTile .tileIcon, .secondaryTile.calendarTile .tileText{position:relative; z-index:2;}

  .upcomingSection{width:100%; max-width:640px; margin-top:26px;}
  .upcomingTitle{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--sub); margin-bottom:10px;}
  .upcomingList{display:flex; flex-direction:column; gap:8px;}
  .upcomingItem{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:11px 14px; text-decoration:none; color:var(--ink); font-size:13px;
    transition:border-color .15s ease, transform .15s ease; box-shadow:var(--shadow-1);
  }
  .upcomingItem:hover{border-color:var(--accent); transform:translateY(-1px);}
  .upcomingDot{width:8px; height:8px; border-radius:50%; flex:none;}
  .upcomingWhen{font-weight:700; color:var(--sub); font-size:12px; flex:none; min-width:82px;}
  .upcomingPatient{font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .footerInfo{display:flex; flex-direction:column; align-items:center; text-align:center; margin-top:44px;}
  .footerInfo h1{font-size:17px; font-weight:700; font-style:italic; margin:0 0 6px;}
  .footerInfo p{font-size:12px; color:var(--sub); margin:0; line-height:1.5; max-width:40ch;}

  @media (max-width:480px){
    .headerLogo{width:50px; height:50px;}
    .headerGreeting h1{font-size:21px;}
    .primaryCard{min-height:200px; padding:16px;}
  }
</style>
<script>
(function(){
  try{
    var t = localStorage.getItem('esercizi_fisio_tool_v1__theme');
    if(t === 'dark' || t === 'light'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>
<script>
/* rileva se questa pagina è stata raggiunta tornando indietro (pulsante
   Indietro/gesture), per invertire l'animazione di transizione: rimpicciolimento
   invece di ingrandimento. Se il browser non supporta la Navigation API, resta
   semplicemente l'animazione di ingrandimento normale. */
window.addEventListener('pagereveal', function(){
  try{
    if(window.navigation && navigation.activation && navigation.activation.navigationType === 'traverse'){
      document.documentElement.classList.add('navBack');
    }
  }catch(e){}
});
</script>

<body>

  <div class="headerRow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---- widget "Prossimi appuntamenti": lettura locale immediata (funziona
   offline, come il resto dell'app), poi se collegato un refresh dal cloud
   per includere gli appuntamenti creati da altri dispositivi. Non scrive
   mai in localStorage da qui: è una vista, la sorgente di verità resta
   calendario.html. ---- */
const LS_PREFIX = 'esercizi_fisio_tool_v1__';
function lsGet(key, fallback){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function escapeHtmlDash(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtUpcomingDay(d){
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate()+1);
  const day = new Date(d); day.setHours(0,0,0,0);
  if(day.getTime()===today.getTime()) return 'Oggi';
  if(day.getTime()===tomorrow.getTime()) return 'Domani';
  return d.toLocaleDateString('it-IT', {day:'numeric', month:'short'});
}
function fmtUpcomingTime(d){ return d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'}); }

function renderUpcoming(list, workTypes){
  const section = document.getElementById('upcomingSection');
  const wrap = document.getElementById('upcomingList');
  if(!list || !list.length){ section.style.display = 'none'; return; }
  section.style.display = '';
  wrap.innerHTML = list.slice(0,4).map(a=>{
    const wt = (workTypes||[]).find(w=>w.id===a.work_type_id);
    const d = new Date(a.start_at);
    return '<a class="upcomingItem" href="calendario.html">'+
      '<span class="upcomingDot" style="background:'+(wt?wt.color:'var(--line)')+'"></span>'+
      '<span class="upcomingWhen">'+fmtUpcomingDay(d)+' · '+fmtUpcomingTime(d)+'</span>'+
      '<span class="upcomingPatient">'+escapeHtmlDash(a.patient_name)+'</span>'+
    '</a>';
  }).join('');
}

(function initUpcomingLocal(){
  const appts = lsGet(LS_PREFIX+'appointments', []);
  const workTypes = lsGet(LS_PREFIX+'workTypes', []);
  const now = new Date();
  const upcoming = appts.filter(a=> new Date(a.start_at) >= now).sort((a,b)=> new Date(a.start_at)-new Date(b.start_at));
  renderUpcoming(upcoming, workTypes);
})();

(async function initUpcomingCloud(){
  const SUPABASE_URL = 'https://tnzsyeqyghknjnbwknry.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ci7BzjLo_d2M8KijY6V5Wg_nQ6IFctR';
  const supabaseClient = (typeof window.supabase !== 'undefined' && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
  if(!supabaseClient) return;
  try{
    const {data:{session}} = await supabaseClient.auth.getSession();
    if(!session || !session.user) return;
    const nowIso = new Date().toISOString();
    const [apptsRes, settingsRes] = await Promise.all([
      supabaseClient.from('appointments').select('*').eq('user_id', session.user.id).gte('start_at', nowIso).order('start_at').limit(4),
      supabaseClient.from('calendar_settings').select('work_types').eq('user_id', session.user.id).maybeSingle()
    ]);
    if(apptsRes.data){
      // esclude appuntamenti eliminati in locale ma non ancora confermati sul cloud
      // (stesso meccanismo di calendario.html: evita che qui riappaiano per qualche istante)
      const pendingDeletes = lsGet(LS_PREFIX+'pendingAppointmentDeletes', []);
      const filtered = apptsRes.data.filter(a=>!pendingDeletes.includes(a.id));
      renderUpcoming(filtered, settingsRes.data ? settingsRes.data.work_types : []);
    }
  }catch(e){}
})();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
