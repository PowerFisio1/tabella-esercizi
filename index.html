<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabella esercizi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f6e56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabella Esercizi">
<style>
  :root{
    --ink:#1c2b2a; --sub:#5b6b69; --line:#dfe3e1; --bg:#f6f7f5;
    --card:#ffffff; --accent:#0f6e56; --accent-light:#e1f5ee;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e8ece9; --sub:#93a39c; --line:#2b3835; --bg:#101614;
      --card:#1a2220; --accent:#25a67d; --accent-light:#173330;
    }
  }
  :root[data-theme="dark"]{
    --ink:#e8ece9; --sub:#93a39c; --line:#2b3835; --bg:#101614;
    --card:#1a2220; --accent:#25a67d; --accent-light:#173330;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 20px 60px; transition:background-color .2s ease, color .2s ease;
  }
  .themeToggle{
    position:fixed; top:16px; right:16px; width:38px; height:38px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-size:16px;
  }
  .themeToggle:hover{border-color:var(--accent);}
  .brand{display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:36px;}
  .brand img{width:104px; height:auto; margin-bottom:14px;}
  .brand h1{font-size:19px; font-weight:700; font-style:italic; margin:0 0 6px;}
  .brand p{font-size:12.5px; color:var(--sub); margin:0; line-height:1.5; max-width:40ch;}
  .tiles{
    width:100%; max-width:640px; display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .tile{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:28px 16px;
    text-decoration:none; color:var(--ink); transition:border-color .15s ease, transform .15s ease;
    min-height:150px;
  }
  .tile:hover{border-color:var(--accent); transform:translateY(-2px);}
  .tile .tileIcon{
    width:48px; height:48px; border-radius:12px; background:var(--accent-light); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .tile .tileIcon svg{width:24px; height:24px;}
  .tile .tileLabel{font-size:14.5px; font-weight:700; text-align:center;}
  .tile .tileSub{font-size:11.5px; color:var(--sub); text-align:center;}
  .tile.soon{opacity:.55; cursor:default; pointer-events:none;}
  .tile.soon .tileIcon{background:var(--line); color:var(--sub);}
  .tile.wide{grid-column:1 / -1;}
  @media (max-width:480px){
    .tiles{grid-template-columns:1fr;}
    .tile.wide{grid-column:auto;}
  }
</style>
<script>
(function(){
  try{
    var t = localStorage.getItem('esercizi_fisio_tool_v1__theme');
    if(t === 'dark' || t === 'light'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>
</head>
<body>
  <button class="themeToggle" id="themeToggle" title="Cambia tema chiaro/scuro">🌙</button>

  <div class="brand">
    <img src="logo.png" alt="Logo">
    <h1>Dott. Kamil Gontarski</h1>
    <p>Fisioterapista iscritto all'albo di Bergamo al nr. 1244 — Trescore Balneario (BG), studio c/o Veryfit</p>
  </div>

  <div class="tiles">
    <a class="tile" href="scheda.html">
      <div class="tileIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="tileLabel">Crea una scheda</div>
      <div class="tileSub">Nuovo foglio esercizi per un paziente</div>
    </a>

    <a class="tile" href="libreria.html">
      <div class="tileIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </div>
      <div class="tileLabel">Libreria esercizi</div>
      <div class="tileSub">Sfoglia e cerca tutti gli esercizi</div>
    </a>

    <div class="tile soon wide">
      <div class="tileIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
      </div>
      <div class="tileLabel">Calendario</div>
      <div class="tileSub">Prossimamente</div>
    </div>
  </div>

<script>
const themeToggle = document.getElementById('themeToggle');
function isDarkNow(){
  const attr = document.documentElement.getAttribute('data-theme');
  if(attr === 'dark') return true;
  if(attr === 'light') return false;
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function updateThemeToggleIcon(){
  themeToggle.textContent = isDarkNow() ? '☀️' : '🌙';
}
themeToggle.addEventListener('click', ()=>{
  const next = isDarkNow() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('esercizi_fisio_tool_v1__theme', next); }catch(e){}
  updateThemeToggleIcon();
});
updateThemeToggleIcon();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
