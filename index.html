<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tabella esercizi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1c3f66">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tabella Esercizi">
<style>
  :root{
    --ink:#1c2b2a; --sub:#5b6b69; --line:#dfe3e1; --bg:#faf3ea;
    --card:#fffdf9; --accent:#1c3f66; --accent-light:#e4ebf2; --accent2:#e8720f;
    /* colore fisso del brand, uguale in chiaro e scuro: non deve seguire --accent
       (che in scuro diventa un azzurro più chiaro) sulle card della dashboard */
    --brand-navy:#1c3f66; --brand-navy-light:#e4ebf2;
    --shadow-1: 0 1px 2px rgba(30,40,35,.05), 0 6px 14px rgba(30,40,35,.07);
    --shadow-1-hover: 0 3px 6px rgba(30,40,35,.07), 0 12px 22px rgba(30,40,35,.11);
    --shadow-primary: 0 2px 4px rgba(10,25,45,.10), 0 12px 26px rgba(10,25,45,.22), inset 0 1px 0 rgba(255,255,255,.10);
    --shadow-primary-hover: 0 4px 8px rgba(10,25,45,.14), 0 18px 34px rgba(10,25,45,.28), inset 0 1px 0 rgba(255,255,255,.14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#eef1f5; --sub:#8fa0b3; --line:#28384a; --bg:#0e1620;
      --card:#16212e; --accent:#4a80c4; --accent-light:#1c2d40; --accent2:#f2913a;
      --shadow-1: 0 1px 2px rgba(0,0,0,.2), 0 6px 16px rgba(0,0,0,.28);
      --shadow-1-hover: 0 3px 6px rgba(0,0,0,.24), 0 14px 26px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"]{
    --ink:#eef1f5; --sub:#8fa0b3; --line:#28384a; --bg:#0e1620;
    --card:#16212e; --accent:#4a80c4; --accent-light:#1c2d40; --accent2:#f2913a;
    --shadow-1: 0 1px 2px rgba(0,0,0,.2), 0 6px 16px rgba(0,0,0,.28);
    --shadow-1-hover: 0 3px 6px rgba(0,0,0,.24), 0 14px 26px rgba(0,0,0,.34);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:40px 20px 60px; transition:background-color .2s ease, color .2s ease;
  }
  .settingsBtn{
    position:fixed; top:16px; right:16px; width:38px; height:38px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; text-decoration:none;
    z-index:10; transition:border-color .15s ease;
  }
  .settingsBtn:hover{border-color:var(--accent);}
  .settingsBtn svg{width:19px; height:19px;}

  /* ---- intestazione: logo piccolo + separatore verticale + saluto ---- */
  .headerRow{
    display:flex; align-items:center; gap:16px; width:100%; max-width:640px; margin-bottom:30px;
  }
  .headerLogo{
    width:60px; height:60px; flex:none; display:block; border-radius:50%;
    background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.14), inset 0 0 0 1px rgba(0,0,0,.04);
    padding:3px;
  }
  .headerDivider{width:1px; align-self:stretch; background:var(--line); flex:none;}
  .headerGreeting h1{font-size:24px; font-weight:400; font-style:italic; margin:0 0 3px; letter-spacing:-.01em;}
  .headerGreeting p{font-size:12.5px; color:var(--sub); margin:0;}

  /* ---- griglia azioni: card principale verticale a sinistra, due orizzontali impilate a destra ---- */
  .actionGrid{
    width:100%; max-width:640px; display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:stretch;
  }
  .stackedCards{display:flex; flex-direction:column; gap:14px;}

  .primaryCard{
    position:relative; display:flex; flex-direction:column; justify-content:space-between;
    /* overlay blu navy semi-trasparente sopra la foto, non un blend-mode legato al tema:
       così la foto resta ben visibile e chiara anche in tema chiaro, invece di scurirsi */
    background:linear-gradient(165deg, rgba(28,63,102,.58), rgba(28,63,102,.76)), url('primary-card-bg.jpg') center/cover;
    color:#fff; border-radius:18px; padding:20px 18px; text-decoration:none;
    min-height:224px; box-shadow:var(--shadow-primary);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .primaryCard:hover{transform:translateY(-3px); box-shadow:var(--shadow-primary-hover);}
  .primaryCard .primaryIcon{
    width:48px; height:48px; border-radius:13px; background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .primaryCard .primaryIcon svg{width:24px; height:24px; stroke:#fff;}
  .primaryCard .eyebrow{font-size:13px; font-weight:400; opacity:.8; margin-bottom:1px;}
  .primaryCard .cardTitle{font-size:19px; font-weight:700;}

  .secondaryTile{
    position:relative; flex:1; display:flex; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
    text-decoration:none; color:var(--ink); box-shadow:var(--shadow-1);
    transition:border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .secondaryTile:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow-1-hover);}
  .secondaryTile .tileIcon{
    width:38px; height:38px; border-radius:11px; background:var(--brand-navy-light); color:var(--brand-navy);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .secondaryTile .tileIcon svg{width:19px; height:19px;}
  .secondaryTile .tileText{min-width:0;}
  .secondaryTile .eyebrow{font-size:11px; font-weight:400; color:var(--sub); margin-bottom:1px;}
  .secondaryTile .cardTitle{font-size:14.5px; font-weight:700;}
  .secondaryTile.soon{opacity:.55; cursor:default; pointer-events:none; box-shadow:none;}
  .secondaryTile.soon .tileIcon{background:var(--line); color:var(--sub);}

  .secondaryTile.libraryTile{
    background:linear-gradient(160deg, rgba(28,63,102,.7), rgba(28,63,102,.84)), url('libreria-card-bg.png') center/cover;
    border-color:transparent; color:#fff;
  }
  .secondaryTile.libraryTile:hover{border-color:rgba(255,255,255,.4);}
  .secondaryTile.libraryTile .tileIcon{background:rgba(255,255,255,.18); color:#fff;}
  .secondaryTile.libraryTile .eyebrow{color:rgba(255,255,255,.8);}

  .footerInfo{display:flex; flex-direction:column; align-items:center; text-align:center; margin-top:44px;}
  .footerInfo h1{font-size:17px; font-weight:700; font-style:italic; margin:0 0 6px;}
  .footerInfo p{font-size:12px; color:var(--sub); margin:0; line-height:1.5; max-width:40ch;}

  @media (max-width:480px){
    .headerLogo{width:50px; height:50px;}
    .headerGreeting h1{font-size:21px;}
    .primaryCard{min-height:200px; padding:16px;}
  }
</style>
<script>
(function(){
  try{
    var t = localStorage.getItem('esercizi_fisio_tool_v1__theme');
    if(t === 'dark' || t === 'light'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}
})();
</script>
</head>
<body>
  <a class="settingsBtn" href="impostazioni.html" title="Impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </a>

  <div class="headerRow">
    <img class="headerLogo" src="logo.png" alt="Logo">
    <div class="headerDivider"></div>
    <div class="headerGreeting">
      <h1>Ciao, Kamil 👋</h1>
      <p>Cosa vuoi fare oggi?</p>
    </div>
  </div>

  <div class="actionGrid">
    <a class="primaryCard" href="scheda.html">
      <div class="primaryIcon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <div class="primaryTextBlock">
        <div class="eyebrow">Crea</div>
        <div class="cardTitle">Scheda</div>
      </div>
    </a>

    <div class="stackedCards">
      <a class="secondaryTile libraryTile" href="libreria.html">
        <div class="tileIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div class="tileText">
          <div class="eyebrow">Sfoglia</div>
          <div class="cardTitle">Libreria</div>
        </div>
      </a>

      <div class="secondaryTile soon">
        <div class="tileIcon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
        </div>
        <div class="tileText">
          <div class="eyebrow">Presto</div>
          <div class="cardTitle">Calendario</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footerInfo">
    <h1>Dott. Kamil Gontarski</h1>
    <p>Fisioterapista iscritto all'albo di Bergamo al nr. 1244 — Trescore Balneario (BG), studio c/o Veryfit</p>
  </div>

<script>
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
